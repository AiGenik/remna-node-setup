name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck jq openssh-server
      - name: Check sources and release archive
        run: ./scripts/check.sh
      - name: Check real SSH transport
        run: sudo bash tests/ssh-transport.sh
  publish:
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Package release
        run: ./scripts/build-release.sh dist "$GITHUB_REF_NAME"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/remna-node-setup.tar.gz dist/SHA256SUMS dist/remna-ssh dist/remna-ssh.sha256 --verify-tag --generate-notes
