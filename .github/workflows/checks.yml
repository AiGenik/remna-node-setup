name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck jq openssh-server
      - name: Check sources and release archive
        run: ./scripts/check.sh
      - name: Check real SSH transport
        run: sudo bash tests/ssh-transport.sh
  macos-check:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check macOS Bash 3.2 launcher and panel relay
        run: |
          bash -n i remna-ssh install.sh
          bash tests/ssh-launcher.sh </dev/null
          python3 tests/panel-launcher.py
  windows-check:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Windows PowerShell client launcher
        run: python tests/windows-launcher.py
